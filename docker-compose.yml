version: "3.9"

services:
  backend:
    build:
      context: ./acquisai-backend
    container_name: acquisai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./acquisai-backend/.env

  frontend:
    build:
      context: ./acquisai-frontend
    container_name: acquisai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend